# Builds FileBridge for macOS, Windows and Linux.
# Runs when you push a version tag (e.g. v1.0.0) or start it by hand under "Actions".
# The finished apps appear as downloadable artifacts, and on a tag also as a GitHub Release.
name: Build FileBridge

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            artifact: FileBridge-macOS
          - os: windows-latest
            artifact: FileBridge-Windows
          - os: ubuntu-22.04
            artifact: FileBridge-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/work build/filebridge.spec

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname FileBridge -srcfolder dist/FileBridge.app -ov -format UDZO dist/FileBridge-macOS.dmg
          rm -rf dist/FileBridge

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/FileBridge
          tar -czf dist/FileBridge-Linux.tar.gz -C dist FileBridge

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.tar.gz
